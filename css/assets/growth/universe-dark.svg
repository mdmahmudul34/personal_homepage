<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" fill="none" aria-hidden="true">
  <defs>
    <path id="leaf-lg" fill="#4aad72" d="M0,0 C-3.2,-5.2 -6.2,-9.2 0,-11.2 C6.2,-9.2 3.2,-5.2 0,0 Z"/>
    <path id="leaf-md" fill="#3d9a62" d="M0,0 C-2.2,-4.2 -4.6,-7.4 0,-9 C5.4,-7.4 3,-4.2 0,0 Z"/>
    <path id="leaf-sm" fill="#72c99a" d="M0,0 C-1.5,-3 -2.4,-5 -0.6,-6 C1.2,-5 1.5,-3 0,0 Z"/>
    <path id="leaf-xl" fill="#5cb888" d="M0,0 C-4.4,-6.6 -5.8,-10.2 -1.2,-11 C3.4,-10.2 4.4,-6.6 0,0 Z"/>
    <g id="berry">
      <circle cx="0" cy="0" r="1.7" fill="#5d3a1b"/>
      <circle cx="3.6" cy="-2.4" r="1.7" fill="#5d3a1b"/>
      <circle cx="-3.2" cy="1.8" r="1.7" fill="#5d3a1b"/>
    </g>
  </defs>
  <!-- main woody stem: top-left corner, curving down-right along the edges -->
  <path d="M10 8 C16 16, 24 26, 34 38, 42 46, 50 54" stroke="#5c3a1e" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  <path d="M10 8 C16 16, 24 26, 34 38, 42 46, 50 54" stroke="#6b4423" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9"/>
  <!-- secondary stem -->
  <path d="M32 36 C38 42, 44 48, 52 54" stroke="#5c3a1e" stroke-width="3.8" stroke-linecap="round" fill="none"/>
  <path d="M32 36 C38 42, 44 48, 52 54" stroke="#6b4423" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.85"/>
  <!-- twiglets (secondary growth) -->
  <path d="M26 30 C30 33, 34 36, 38 39" stroke="#4a2f18" stroke-width="1.1" stroke-linecap="round" opacity="0.55"/>
  <path d="M22 22 C27 26, 32 30, 38 34" stroke="#4a2f18" stroke-width="1.1" stroke-linecap="round" opacity="0.55"/>
  <path d="M30 40 C36 45, 42 50, 48 52" stroke="#4a2f18" stroke-width="1.1" stroke-linecap="round" opacity="0.5"/>
  <!-- leaf clusters along both stems -->
  <use href="#leaf-lg" transform="translate(18,14) rotate(16)"/>
  <use href="#leaf-xl" transform="translate(22,18) rotate(8)"/>
  <use href="#leaf-md" transform="translate(26,22) rotate(-6)"/>
  <use href="#leaf-sm" transform="translate(20,20) rotate(-14)"/>
  <use href="#leaf-lg" transform="translate(30,26) rotate(-12)"/>
  <use href="#leaf-md" transform="translate(34,22) rotate(4)"/>
  <use href="#leaf-xl" transform="translate(24,28) rotate(-22)"/>
  <use href="#leaf-sm" transform="translate(28,30) rotate(-10)"/>
  <use href="#leaf-lg" transform="translate(36,34) rotate(-10)"/>
  <use href="#leaf-md" transform="translate(40,30) rotate(8)"/>
  <use href="#leaf-xl" transform="translate(32,38) rotate(-16)"/>
  <use href="#leaf-sm" transform="translate(36,38) rotate(-4)"/>
  <use href="#leaf-lg" transform="translate(42,40) rotate(14)"/>
  <use href="#leaf-md" transform="translate(46,44) rotate(-10)"/>
  <use href="#leaf-xl" transform="translate(38,46) rotate(6)"/>
  <use href="#leaf-sm" transform="translate(34,44) rotate(-28)"/>
  <use href="#leaf-lg" transform="translate(50,48) rotate(-8)"/>
  <use href="#leaf-md" transform="translate(30,24) rotate(22)"/>
  <use href="#leaf-sm" transform="translate(24,24) rotate(-30)"/>
  <use href="#leaf-xl" transform="translate(44,34) rotate(20)"/>
  <!-- berries -->
  <use href="#berry" transform="translate(28,28)"/>
  <use href="#berry" transform="translate(40,38)"/>
</svg>
